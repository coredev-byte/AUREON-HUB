# Render.com (plano gratuito aceita WebSocket). Crie um "Blueprint" apontando para este arquivo.
services:
  - type: web
    name: aureon-signal
    runtime: docker
    rootDir: server
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: TRUST_PROXY
        value: "1"
      # TURN gratuito da Cloudflare (recomendado): Realtime > TURN Server > criar chave
      - key: CF_TURN_KEY_ID
        sync: false
      - key: CF_TURN_API_TOKEN
        sync: false
