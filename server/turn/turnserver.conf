# coturn para o Aureon Hub (retransmissão quando a conexão direta é bloqueada).
# Troque REALM, o IP externo e o segredo (o MESMO valor vai em TURN_SECRET do servidor de sinalização).
listening-port=3478
tls-listening-port=5349
# external-ip=IP_PUBLICO_DO_SERVIDOR
realm=turn.seu-dominio.com
use-auth-secret
static-auth-secret=TROQUE_POR_UM_SEGREDO_LONGO
# certificados TLS (Let's Encrypt) para turns:...:5349 / 443
# cert=/etc/letsencrypt/live/turn.seu-dominio.com/fullchain.pem
# pkey=/etc/letsencrypt/live/turn.seu-dominio.com/privkey.pem
fingerprint
no-cli
no-multicast-peers
# não deixa o TURN alcançar redes internas do servidor
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
min-port=49160
max-port=49200
total-quota=100
bps-capacity=0
stale-nonce=600
