# Testes em todo push e instalador de teste do Windows (artefato, NÃO é publicado como release).
name: build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - run: sudo apt-get install -y coturn && node tests/e2e/share-turn-e2e.cjs
      - run: npm run test:electron

  windows-installer:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win nsis --x64 --publish never
      # instala em silêncio, abre em modo fumaça, confere o relatório e desinstala
      - name: Instalar, abrir e desinstalar
        shell: pwsh
        run: |
          $setup = Get-ChildItem release -Filter "AureonHub-Setup-*.exe" | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList "/S" -Wait
          Start-Sleep 3
          # o instalador por usuário usa %LOCALAPPDATA%\Programs\<nome>; procura em vez de adivinhar o nome da pasta
          $exe = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs"), $env:ProgramFiles -Recurse -Filter "Aureon Hub.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "não instalou (Aureon Hub.exe não encontrado)" }
          Write-Host "Instalado em $($exe.DirectoryName)"
          $env:AUREON_SMOKE = "1"; $env:AUREON_SMOKE_OUT = Join-Path $env:RUNNER_TEMP "smoke.json"; $env:AUREON_DATA_DIR = Join-Path $env:RUNNER_TEMP "dados"
          Start-Process $exe.FullName -Wait
          $r = Get-Content $env:AUREON_SMOKE_OUT | ConvertFrom-Json
          $r | ConvertTo-Json -Depth 5
          if (-not $r.ok) { throw "o app abriu com erros" }
          $un = Get-ChildItem $exe.DirectoryName -Filter "Uninstall*.exe" | Select-Object -First 1
          Start-Process $un.FullName -ArgumentList "/S" -Wait
          Start-Sleep 8
          if (Test-Path $exe.FullName) { throw "não desinstalou" }
          Write-Host "Instalou, abriu sem erros e desinstalou."
      - uses: actions/upload-artifact@v4
        with:
          name: AureonHub-Setup
          path: release/AureonHub-Setup-*.exe
