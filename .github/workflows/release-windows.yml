name: Release Windows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-windows.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'electron/**'
      - 'src/**'
      - 'build/**'
      - 'index.html'
      - 'notch.html'
      - 'widgets.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build app
        run: npm run build
      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "release/AureonHub-Setup-*.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $installer -or $installer.Length -lt 1000000) { throw "No usable installer generated" }
          Write-Output "Built: $($installer.Name) ($($installer.Length) bytes)"
      - name: Publish download in GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          name: Aureon Hub 0.1.0 - Windows (teste)
          target_commitish: main
          draft: false
          prerelease: true
          generate_release_notes: false
          body: |
            Versão de teste do Aureon Hub para Windows x64.
            Notch Carbono, widgets e transmissão de tela (requer servidor de sinalização).
            Não validada ainda em dois computadores em redes distintas.
            Instalador não assinado digitalmente.
          files: release/AureonHub-Setup-*.exe
          fail_on_unmatched_files: true
