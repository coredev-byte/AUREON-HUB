# Publica uma versão nova (instalador + latest.yml, que o app usa para se atualizar sozinho).
# Dispara quando a versão do package.json muda na main, ou com uma etiqueta vX.Y.Z.
name: Lançar versão

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["package.json"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }

      - name: Versão e etiqueta
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v${VERSION}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$TAG" ]]; then echo "Etiqueta diferente da versão do package.json"; exit 1; fi
          if [[ "$GITHUB_REF_TYPE" != "tag" ]] && git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Etiqueta $TAG já existe: nada a publicar."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"; echo "skip=false" >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.skip != 'true'
        run: npm ci
      - if: steps.version.outputs.skip != 'true'
        run: npm run lint && npm test
      - if: steps.version.outputs.skip != 'true'
        run: npm run build
      - name: Gerar e publicar o instalador
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis --x64 --publish always

      - name: Compactar versão portátil
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          if (!(Test-Path "release/win-unpacked/Aureon Hub.exe")) { throw "Executável portátil ausente" }
          Compress-Archive -Path "release/win-unpacked/*" -DestinationPath "release/AureonHub-0.1.2-portatil.zip" -Force
      - name: Publicar ZIP portátil na release
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v0.1.2 "release/AureonHub-0.1.2-portatil.zip" --clobber --repo "$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "Falha ao publicar ZIP portátil" }
